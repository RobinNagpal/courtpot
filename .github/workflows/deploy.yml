# Deploys on every push to main:
#   web  → Expo static export synced to S3, then a CloudFront invalidation
#   api  → esbuild bundle rsynced to the shared Lightsail host, then a restart
#
# The API is a systemd service on a host shared with interestled — one instance,
# one application per port — so the API half of this workflow uses SSH rather
# than AWS credentials. See deployment/README.md.
#
# Needs (created by deployment/terraform and .../shared-host, values in outputs):
#   secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (the courtpot-deployer user)
#            SSH_PRIVATE_KEY                           (the shared host's deploy user)
#            DATABASE_URL                              (same Postgres the API uses)
#   vars:    S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, DEPLOY_HOST, SSH_HOST_KEY
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  APP: courtpot
  API_HOST: api.courtpot.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export web app
        working-directory: apps/mobile
        env:
          # Same origin as the app: CloudFront serves both, so there is no CORS.
          EXPO_PUBLIC_API_URL: https://courtpot.com
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Sync web app to S3
        run: |
          # Hashed assets are cached forever; index.html must always revalidate
          # so a new deploy is picked up immediately.
          aws s3 sync apps/mobile/dist "s3://$S3_BUCKET" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp apps/mobile/dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      # Runs before the new code, so a deploy that adds a migration applies it.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter server exec prisma migrate deploy

      - name: Build server bundle
        run: bash deployment/scripts/build-server.sh

      - name: Authorise SSH to the shared host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned, not accepted on first use: this key is what stops a hijacked
          # record from collecting a deploy key that can restart both APIs.
          # Recreating the instance changes it — re-read it with `ssh-keyscan`
          # and update the SSH_HOST_KEY variable when that happens.
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Ship the API to the shared host
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ssh_opts=(
            -i "$HOME/.ssh/id_deploy"
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o StrictHostKeyChecking=yes
          )

          # Staged beside the live directory and swapped, so systemd can never
          # restart into a half-transferred bundle.
          rsync -az --delete -e "ssh ${ssh_opts[*]}" \
            deployment/dist/server/ "deploy@$DEPLOY_HOST:/srv/$APP/next/"

          # Piped rather than passed as an argument: an argument is visible in
          # `ps` to anything else on the host for as long as the command runs.
          # This rewrites the file each deploy, so it is the workflow — not a
          # hand edit on the box — that decides what the service runs with.
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" \
            | ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" "umask 077 && cat > /etc/$APP-api.env"

          ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" "
            set -euo pipefail
            rm -rf /srv/$APP/current
            mv /srv/$APP/next /srv/$APP/current
            sudo systemctl restart $APP-api
          "

      - name: Verify the API is serving
        run: |
          ssh_opts=(
            -i "$HOME/.ssh/id_deploy"
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o StrictHostKeyChecking=yes
          )

          # Against the origin rather than through CloudFront: this is the hop
          # the deploy actually changed, and it proves Caddy's certificate and
          # the service behind it in one request.
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$API_HOST/health"; then
              echo; echo "API is serving."
              exit 0
            fi
            echo "attempt $attempt: not serving yet"
            sleep 5
          done

          echo "::error::$APP-api did not come up. Last 60 log lines:"
          ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" \
            "systemctl is-active $APP-api || true; journalctl -u $APP-api -n 60 --no-pager"
          exit 1
